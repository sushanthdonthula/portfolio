services:
  web:
    image: nginx:1.27-alpine
    restart: on-failure
    ports:
      - "3000:80"
    volumes:
      - ./:/usr/share/nginx/html:ro
      - ./nginx.base44.conf:/etc/nginx/nginx.conf:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:80/index.html"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
